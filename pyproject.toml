[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ecomplexity"
version = "0.5.3"
description = "Package to calculate economic complexity and associated variables"
readme = { file = "README.md", content-type = "text/markdown" }
authors = [
    { name = "Shreyas Gadgin Matha", email = "tattle.sabot_0a@icloud.com" },
]
license = { file = "LICENSE" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Development Status :: 4 - Beta",
    "Topic :: Scientific/Engineering",
    "Intended Audience :: Science/Research",
]
keywords = ["pandas", "python", "networks", "economics", "complexity"]
dependencies = ["pandas >1.0", "numpy >1.22.0"]
requires-python = ">=3.8"

[project.optional-dependencies]
knn = ["scikit-learn >1.0.0"]

[project.urls]
Homepage = "https://github.com/cid-harvard/py-ecomplexity"
Repository = "https://github.com/cid-harvard/py-ecomplexity"
Documentation = "https://github.com/cid-harvard/py-ecomplexity#readme"
Issues = "https://github.com/cid-harvard/py-ecomplexity/issues"

[tool.hatch.build.targets.wheel]
packages = ["ecomplexity"]

[tool.hatch.build.targets.sdist]
exclude = [
    "/.ipynb_checkpoints",
    "/.DS_Store",
    "/archive",
    "/demo",
    "/data",
    "/build",
    "/dist",
]

[tool.ruff]
ignore = ["E501"]
