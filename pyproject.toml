[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ecomplexity"
version = "0.5.3"
description = "Package to calculate economic complexity and associated variables"
readme = { file = "README.md", content-type = "text/markdown" }
authors = [
    { name = "Shreyas Gadgin Matha", email = "tattle.sabot_0a@icloud.com" },
]
license = { file = "LICENSE" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Development Status :: 4 - Beta",
    "Topic :: Scientific/Engineering",
    "Intended Audience :: Science/Research",
]
keywords = ["pandas", "python", "networks", "economics", "complexity"]
dependencies = ["pandas >1.0", "numpy >1.22.0"]
requires-python = ">=3.9"

[project.optional-dependencies]
knn = ["scikit-learn >1.0.0"]
dev = [
    "pytest>=7.4.0",
    "pytest-cov >=4.0.0",
    "ruff >=0.11.0",
    "mypy>=1.15.0",
    "pre-commit>=4.1.0",
]

[project.urls]
Homepage = "https://github.com/cid-harvard/py-ecomplexity"
Repository = "https://github.com/cid-harvard/py-ecomplexity"
Documentation = "https://github.com/cid-harvard/py-ecomplexity#readme"
Issues = "https://github.com/cid-harvard/py-ecomplexity/issues"

[tool.hatch.build.targets.wheel]
packages = ["ecomplexity"]

[tool.hatch.build.targets.sdist]
exclude = [
    "/.ipynb_checkpoints",
    "/.DS_Store",
    "/archive",
    "/demo",
    "/data",
    "/build",
    "/dist",
]

[tool.ruff]
line-length = 88
target-version = "py39"

[tool.ruff.lint]
select = [
    "E",    # Critical errors
    "F",    # Pyflakes
    "B",    # Bug detection
    "I",    # Import sorting
    "N",    # Naming
    "T20",  # Print statements
    "UP",   # Python upgrades
]
ignore = ["E501", "F841"] # Ignore line length and unused variable errors

[tool.ruff.lint.per-file-ignores]
"**/test_*.py" = ["T201"]
"**/tests/**/*.py" = ["T201"]

# Configure specific documentation rules
[tool.ruff.lint.pydocstyle]
convention = "google"  # Use Google-style docstrings

# Configure formatting rules
[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
skip-magic-trailing-comma = false

# Configure import sorting rules
[tool.ruff.lint.isort]
known-first-party = ["ecomplexity"]
force-single-line = false
section-order = ["future", "standard-library", "third-party", "first-party", "local-folder"]

[tool.mypy]
python_version = "3.9"
ignore_missing_imports = true
show_error_codes = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
]
